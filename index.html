<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeriSight-AI | Forensic Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              forensic: {
                900: '#0f172a',
                800: '#1e293b',
                700: '#334155',
                accent: '#0ea5e9', // Sky blue for trust
                danger: '#ef4444', // Red for fake
                safe: '#10b981',   // Green for real
                warn: '#f59e0b',   // Amber for suspicious
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'fade-in': 'fadeIn 1s ease-out forwards',
              'text-shimmer': 'textShimmer 3s ease-in-out infinite alternate',
              'gradient-x': 'gradientX 15s ease infinite',
              'scan': 'scan 2s ease-in-out infinite',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scale-in': 'scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              textShimmer: {
                '0%': { color: '#94a3b8' }, // slate-400
                '100%': { color: '#ffffff' }, // white
              },
              gradientX: {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center',
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center',
                },
              },
              scan: {
                '0%': { top: '-100%' },
                '100%': { top: '100%' }
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Print styles for the report */
      @media print {
        @page {
          margin: 15mm;
          size: auto;
        }
        
        /* Reset body and html to ensure full scrollability/printing */
        html, body {
          visibility: hidden;
          height: auto !important;
          overflow: visible !important;
          background: white !important;
          color: black !important;
        }

        /* Hide all root children by default */
        body * {
          visibility: hidden;
        }

        /* Specifically target the report container and its children */
        #printable-report, #printable-report * {
          visibility: visible;
        }

        /* Position the report at the top-left of the page */
        #printable-report {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0;
          overflow: visible !important;
          display: block !important;
        }

        /* Ensure images and charts don't break across pages awkwardly */
        img, svg, canvas {
          break-inside: avoid;
        }
        
        /* Hide non-print UI explicitly */
        .no-print {
          display: none !important;
        }
      }
      
      /* Utilities */
      .bg-300 {
        background-size: 300% 300%;
      }
      .animation-delay-200 {
        animation-delay: 200ms;
      }
      .animation-delay-400 {
        animation-delay: 400ms;
      }
      .animation-delay-500 {
        animation-delay: 500ms;
      }
      .animation-delay-700 {
        animation-delay: 700ms;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-forensic-900 text-slate-200 antialiased overflow-x-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
